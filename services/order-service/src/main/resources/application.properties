# Service identity
quarkus.application.name=order-service
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/orderdb
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/orderdb
%prod.assembly-api/mp-rest/url=http://assembly-service:8080/
%dev.assembly-api/mp-rest/url=http://localhost:8085/
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=factory
quarkus.datasource.password=factory
# Schema managed by Flyway migrations (src/main/resources/db/migration)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.hibernate-orm.database.generation=validate
# HTTP (dev uses this port; in container the service listens on 8080 via QUARKUS_PROFILE=prod)
quarkus.http.port=8081
%prod.quarkus.http.port=8080
# Kafka bootstrap (dev = host, prod/container = internal listener)
%dev.kafka.bootstrap.servers=localhost:9092
%prod.kafka.bootstrap.servers=kafka:29092
# OpenAPI / Swagger
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Order Service API
# --- Messaging channels: add per event this service produces/consumes ---
mp.messaging.incoming.quality-approved.failure-strategy=ignore
mp.messaging.incoming.quality-rework-required.failure-strategy=ignore
mp.messaging.outgoing.order-created-out.connector=smallrye-kafka
mp.messaging.outgoing.order-created-out.topic=order-created
mp.messaging.outgoing.order-created-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.order-created-out.value.serializer=com.smartfactory.common.kafka.OrderCreatedEventSerializer
mp.messaging.outgoing.order-status-updated.connector=smallrye-kafka
mp.messaging.outgoing.order-status-updated.topic=order-status-updated
mp.messaging.outgoing.order-status-updated.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.order-status-updated.value.serializer=com.smartfactory.common.kafka.OrderStatusUpdatedEventSerializer
mp.messaging.outgoing.order-completed.connector=smallrye-kafka
mp.messaging.outgoing.order-completed.topic=order-completed
mp.messaging.outgoing.order-completed.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.order-completed.value.serializer=com.smartfactory.common.kafka.OrderCompletedEventSerializer
mp.messaging.incoming.quality-approved.connector=smallrye-kafka
mp.messaging.incoming.quality-approved.topic=quality-approved
mp.messaging.incoming.quality-approved.group.id=order-service-group
mp.messaging.incoming.quality-approved.auto.offset.reset=earliest
mp.messaging.incoming.quality-approved.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.quality-approved.value.deserializer=com.smartfactory.common.kafka.QualityApprovedEventDeserializer
mp.messaging.incoming.quality-rework-required.connector=smallrye-kafka
mp.messaging.incoming.quality-rework-required.topic=quality-rework-required
mp.messaging.incoming.quality-rework-required.group.id=order-service-group
mp.messaging.incoming.quality-rework-required.auto.offset.reset=earliest
mp.messaging.incoming.quality-rework-required.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.quality-rework-required.value.deserializer=com.smartfactory.common.kafka.QualityReworkRequiredEventDeserializer
mp.messaging.incoming.quality-failed.failure-strategy=ignore
mp.messaging.incoming.quality-failed.connector=smallrye-kafka
mp.messaging.incoming.quality-failed.topic=quality-failed
mp.messaging.incoming.quality-failed.group.id=order-service-group
mp.messaging.incoming.quality-failed.auto.offset.reset=earliest
mp.messaging.incoming.quality-failed.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.quality-failed.value.deserializer=com.smartfactory.common.kafka.QualityFailedEventDeserializer
# Drives the order from CREATED to QUALITY_CHECK when assembly finishes the vehicle.
mp.messaging.incoming.vehicle-assembled.failure-strategy=ignore
mp.messaging.incoming.vehicle-assembled.connector=smallrye-kafka
mp.messaging.incoming.vehicle-assembled.topic=vehicle-assembled
mp.messaging.incoming.vehicle-assembled.group.id=order-service-group
mp.messaging.incoming.vehicle-assembled.auto.offset.reset=earliest
mp.messaging.incoming.vehicle-assembled.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.vehicle-assembled.value.deserializer=com.smartfactory.common.kafka.VehicleAssembledEventDeserializer
# do not start containers at testing
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false
