# Application
quarkus.application.name=planning-service
# HTTP
# Local development port
quarkus.http.port=8082
# Container port
%prod.quarkus.http.port=8080
# Postgres
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=factory
quarkus.datasource.password=factory
# Local database
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/planningdb
# Docker Compose database
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/planningdb
# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
# Hibernate
# Validate that the database schema matches the JPA entities.
# Flyway remains responsible for creating and updating the schema.
quarkus.hibernate-orm.database.generation=validate
# Kafka broker
# Local Kafka broker
%dev.kafka.bootstrap.servers=localhost:9092
# Kafka broker inside Docker Compose
%prod.kafka.bootstrap.servers=kafka:29092
# INCOMING CHANNELS
# Kafka incoming channel: order-created
mp.messaging.incoming.order-created.connector=smallrye-kafka
mp.messaging.incoming.order-created.topic=order-created
mp.messaging.incoming.order-created.group.id=planning-order-created
mp.messaging.incoming.order-created.value.deserializer=com.smartfactory.common.kafka.OrderCreatedEventDeserializer
# Dlq for messages that can not be processed
mp.messaging.incoming.order-created.failure-strategy=dead-letter-queue
mp.messaging.incoming.order-created.dead-letter-queue.topic=order-created-dlq
mp.messaging.incoming.order-created.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
# Kafka incoming channel: order-created-dlq
mp.messaging.incoming.order-created-dlq.connector=smallrye-kafka
mp.messaging.incoming.order-created-dlq.topic=order-created-dlq
mp.messaging.incoming.order-created-dlq.group.id=planning-order-created-dlq
mp.messaging.incoming.order-created-dlq.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Kafka incoming channel: vehicle-stage-advanced
mp.messaging.incoming.vehicle-stage-advanced.connector=smallrye-kafka
mp.messaging.incoming.vehicle-stage-advanced.topic=vehicle-stage-advanced
mp.messaging.incoming.vehicle-stage-advanced.group.id=planning-vehicle-stage-advanced
mp.messaging.incoming.vehicle-stage-advanced.value.deserializer=com.smartfactory.common.kafka.VehicleStageAdvancedEventDeserializer
# DLQ configuration
mp.messaging.incoming.vehicle-stage-advanced.failure-strategy=dead-letter-queue
mp.messaging.incoming.vehicle-stage-advanced.dead-letter-queue.topic=vehicle-stage-advanced-dlq
mp.messaging.incoming.vehicle-stage-advanced.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
# Kafka incoming channel: vehicle-stage-advanced-dlq
mp.messaging.incoming.vehicle-stage-advanced-dlq.connector=smallrye-kafka
mp.messaging.incoming.vehicle-stage-advanced-dlq.topic=vehicle-stage-advanced-dlq
mp.messaging.incoming.vehicle-stage-advanced-dlq.group.id=planning-vehicle-stage-advanced-dlq
mp.messaging.incoming.vehicle-stage-advanced-dlq.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Kafka incoming channel: vehicle-assembled
mp.messaging.incoming.vehicle-assembled.connector=smallrye-kafka
mp.messaging.incoming.vehicle-assembled.topic=vehicle-assembled
mp.messaging.incoming.vehicle-assembled.group.id=planning-vehicle-assembled
mp.messaging.incoming.vehicle-assembled.value.deserializer=com.smartfactory.common.kafka.VehicleAssembledEventDeserializer
# DLQ configuration
mp.messaging.incoming.vehicle-assembled.failure-strategy=dead-letter-queue
mp.messaging.incoming.vehicle-assembled.dead-letter-queue.topic=vehicle-assembled-dlq
mp.messaging.incoming.vehicle-assembled.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
# Kafka incoming channel: vehicle-assembled-dlq
mp.messaging.incoming.vehicle-assembled-dlq.connector=smallrye-kafka
mp.messaging.incoming.vehicle-assembled-dlq.topic=vehicle-assembled-dlq
mp.messaging.incoming.vehicle-assembled-dlq.group.id=planning-vehicle-assembled-dlq
mp.messaging.incoming.vehicle-assembled-dlq.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# OUTGOING CHANNELS
# Kafka outgoing channel: production-planned
mp.messaging.outgoing.production-planned.connector=smallrye-kafka
mp.messaging.outgoing.production-planned.topic=production-planned
# The Kafka key is DomainEvent.correlationId, which is vehicleId.
mp.messaging.outgoing.production-planned.key.serializer=org.apache.kafka.common.serialization.StringSerializer
# Serialize ProductionPlannedEvent as JSON.
mp.messaging.outgoing.production-planned.value.serializer=com.smartfactory.common.kafka.ProductionPlannedEventSerializer
# Recommended producer reliability settings.
mp.messaging.outgoing.production-planned.acks=all
mp.messaging.outgoing.production-planned.enable.idempotence=true
# Kafka outgoing channel: planning-kpi-updated
mp.messaging.outgoing.planning-kpi-updated.connector=smallrye-kafka
mp.messaging.outgoing.planning-kpi-updated.topic=planning-kpi-updated
mp.messaging.outgoing.planning-kpi-updated.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.planning-kpi-updated.value.serializer=com.smartfactory.common.kafka.PlanningKpiUpdatedEventSerializer
# File logging
quarkus.log.file.enable=true
quarkus.log.file.path=logs/application.log
quarkus.log.file.level=INFO
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=1
# Open API & Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Planning Service API