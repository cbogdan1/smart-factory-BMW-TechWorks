# H2 test datasource
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:planningdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
# Hibernate schema management for tests
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.kafka.devservices.enabled=false
# Disable Flyway in H2 tests
quarkus.flyway.active=false
# Load the auxiliary processed_event table
quarkus.hibernate-orm.sql-load-script=import.sql
# Disable the real Kafka connector
mp.messaging.incoming.order-created.enabled=false
mp.messaging.incoming.order-created-dlq.enabled=false
mp.messaging.outgoing.production-planned.enabled=false