# Service identity
quarkus.application.name=quality-service
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/qualitydb
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/qualitydb
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=factory
quarkus.datasource.password=factory
# Schema managed by Flyway migrations (src/main/resources/db/migration)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.hibernate-orm.database.generation=validate
# HTTP (dev uses this port; in container the service listens on 8080 via QUARKUS_PROFILE=prod)
quarkus.http.port=8087
%prod.quarkus.http.port=8080
# Kafka bootstrap (dev = host, prod/container = internal listener)
%dev.kafka.bootstrap.servers=localhost:9092
%prod.kafka.bootstrap.servers=kafka:29092
# OpenAPI / Swagger
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Quality Service API
# --- Messaging channels: add per event this service produces/consumes ---
mp.messaging.outgoing.quality-approved.connector=smallrye-kafka
mp.messaging.outgoing.quality-approved.topic=quality-approved
mp.messaging.outgoing.quality-approved.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.quality-approved.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.quality-approved.acks=all
mp.messaging.outgoing.quality-approved.enable.idempotence=true
mp.messaging.outgoing.quality-rework-required.connector=smallrye-kafka
mp.messaging.outgoing.quality-rework-required.topic=quality-rework-required
mp.messaging.outgoing.quality-rework-required.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.quality-rework-required.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.quality-rework-required.acks=all
mp.messaging.outgoing.quality-rework-required.enable.idempotence=true
mp.messaging.outgoing.quality-failed.connector=smallrye-kafka
mp.messaging.outgoing.quality-failed.topic=quality-failed
mp.messaging.outgoing.quality-failed.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.quality-failed.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.quality-failed.acks=all
mp.messaging.outgoing.quality-failed.enable.idempotence=true
# Kafka incoming channel: vehicle-assembled
mp.messaging.incoming.vehicle-assembled.connector=smallrye-kafka
mp.messaging.incoming.vehicle-assembled.topic=vehicle-assembled
mp.messaging.incoming.vehicle-assembled.group.id=quality-vehicle-assembled
mp.messaging.incoming.vehicle-assembled.auto.offset.reset=earliest
mp.messaging.incoming.vehicle-assembled.value.deserializer=com.smartfactory.common.kafka.VehicleAssembledEventDeserializer