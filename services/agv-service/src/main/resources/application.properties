# Service identity
quarkus.application.name=agv-service
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/agvdb
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/agvdb
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=factory
quarkus.datasource.password=factory
# Schema managed by Flyway migrations (src/main/resources/db/migration)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.hibernate-orm.database.generation=validate
# HTTP (dev uses this port; in container the service listens on 8080 via QUARKUS_PROFILE=prod)
quarkus.http.port=8086
%prod.quarkus.http.port=8080
# Kafka bootstrap (dev = host, prod/container = internal listener)
%dev.kafka.bootstrap.servers=localhost:9092
%prod.kafka.bootstrap.servers=kafka:29092
# OpenAPI / Swagger
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=AGV Service API
# --- Messaging channels: add per event this service produces/consumes ---
# mp.messaging.outgoing.<event>.connector=smallrye-kafka
# mp.messaging.outgoing.<event>.topic=<topic-name>
# mp.messaging.outgoing.<event>.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.incoming.material-requested.value.deserializer=com.smartfactory.common.kafka.MaterialRequestedEventDeserializer
mp.messaging.outgoing.material-delivered.value.serializer=com.smartfactory.common.kafka.MaterialDeliveredEventSerializer
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:agvtestdb;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.kafka.devservices.enabled=false
quarkus.log.file.enable=true
quarkus.log.file.path=logs/agv-service.log
quarkus.log.file.level=INFO