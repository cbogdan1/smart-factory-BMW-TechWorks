# Service identity
quarkus.application.name=inventory-service
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/inventorydb
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/inventorydb
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=factory
quarkus.datasource.password=factory
# Schema managed by Flyway migrations (src/main/resources/db/migration)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.hibernate-orm.database.generation=validate
# HTTP (dev uses this port; in container the service listens on 8080 via QUARKUS_PROFILE=prod)
quarkus.http.port=8083
%prod.quarkus.http.port=8080
# Kafka bootstrap (dev = host, prod/container = internal listener)
%dev.kafka.bootstrap.servers=localhost:9092
%prod.kafka.bootstrap.servers=kafka:29092
# OpenAPI / Swagger
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Inventory Service API
# --- Messaging channels: add per event this service produces/consumes ---
# mp.messaging.outgoing.<event>.connector=smallrye-kafka
# mp.messaging.outgoing.<event>.topic=<topic-name>
# mp.messaging.outgoing.<event>.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
# ==========================================================
# TEST PROFILE
# ==========================================================
# Use the locally running PostgreSQL database instead of
# allowing Quarkus to create a PostgreSQL Docker container.
#%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/inventorydb
# The inventory tests currently do not use Kafka.
# Prevent Quarkus from attempting to start Kafka in Docker.
#%test.quarkus.kafka.devservices.enabled=false

mp.messaging.incoming.production-planned.connector=smallrye-kafka
mp.messaging.incoming.production-planned.topic=production-planned
mp.messaging.incoming.production-planned.value.deserializer=com.smartfactory.common.kafka.ProductionPlannedEventDeserializer

mp.messaging.outgoing.parts-reserved.connector=smallrye-kafka
mp.messaging.outgoing.parts-reserved.topic=parts-reserved
mp.messaging.outgoing.parts-reserved.value.serializer=com.smartfactory.common.kafka.PartsReservedEventSerializer

mp.messaging.incoming.parts-delivered.connector=smallrye-kafka
mp.messaging.incoming.parts-delivered.topic=parts-delivered
mp.messaging.incoming.parts-delivered.value.deserializer=com.smartfactory.common.kafka.PartsDeliveredEventDeserializer

mp.messaging.outgoing.inventory-low-stock.connector=smallrye-kafka
mp.messaging.outgoing.inventory-low-stock.topic=inventory-low-stock
mp.messaging.outgoing.inventory-low-stock.value.serializer=com.smartfactory.common.kafka.InventoryLowStockEventSerializer

mp.messaging.incoming.material-delivered.connector=smallrye-kafka
mp.messaging.incoming.material-delivered.topic=material-delivered
mp.messaging.incoming.material-delivered.value.deserializer=com.smartfactory.common.kafka.MaterialDeliveredEventDeserializer