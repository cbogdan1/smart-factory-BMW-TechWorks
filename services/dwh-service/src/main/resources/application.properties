# Service identity
quarkus.application.name=dwh-service
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/dwhdb
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/dwhdb
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=factory
quarkus.datasource.password=factory
# Schema managed by Flyway migrations (src/main/resources/db/migration)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.hibernate-orm.database.generation=validate
# HTTP (dev uses this port; in container the service listens on 8080 via QUARKUS_PROFILE=prod)
quarkus.http.port=8088
%prod.quarkus.http.port=8080
# Kafka bootstrap (dev = host, prod/container = internal listener)
%dev.kafka.bootstrap.servers=localhost:9092
%prod.kafka.bootstrap.servers=kafka:29092
# OpenAPI / Swagger
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=DWH Service API
# --- Messaging channels: add per event this service produces/consumes ---
# Order Created Consumer
mp.messaging.incoming.order-created.connector=smallrye-kafka
mp.messaging.incoming.order-created.topic=order-created
mp.messaging.incoming.order-created.group.id=dwh-order-created
mp.messaging.incoming.order-created.auto.offset.reset=earliest
mp.messaging.incoming.order-created.value.deserializer=com.smartfactory.common.kafka.OrderCreatedEventDeserializer
