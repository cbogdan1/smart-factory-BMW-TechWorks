# Service identity
quarkus.application.name=procurement-service
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/procurementdb
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/procurementdb
%prod.inventory-api/mp-rest/url=http://inventory-service:8083/
%dev.inventory-api/mp-rest/url=http://localhost:8083/
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=factory
quarkus.datasource.password=factory
# Schema managed by Flyway migrations (src/main/resources/db/migration)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.hibernate-orm.database.generation=validate
# HTTP (dev uses this port; in container the service listens on 8080 via QUARKUS_PROFILE=prod)
quarkus.http.port=8084
%prod.quarkus.http.port=8080
# Kafka bootstrap (dev = host, prod/container = internal listener)
%dev.kafka.bootstrap.servers=localhost:9092
%prod.kafka.bootstrap.servers=kafka:29092
# Kafka incoming channel: parts-shortage-detected
mp.messaging.incoming.parts-shortage-detected.failure-strategy=ignore
mp.messaging.incoming.parts-shortage-detected.connector=smallrye-kafka
mp.messaging.incoming.parts-shortage-detected.topic=parts-shortage-detected
mp.messaging.incoming.parts-shortage-detected.value.deserializer=com.smartfactory.common.kafka.PartsShortageDetectedEventDeserializer
# OpenAPI / Swagger
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Procurement Service API
# --- Messaging channels: add per event this service produces/consumes ---
mp.messaging.outgoing.parts-delivered.connector=smallrye-kafka
mp.messaging.outgoing.parts-delivered.topic=parts-delivered
mp.messaging.outgoing.parts-delivered.value.serializer=com.smartfactory.common.kafka.PartsDeliveredEventSerializer
# --- TEST PROFILE overrides (Bypasses Docker/Dev Services) ---
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:procurementtestdb;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.kafka.devservices.enabled=false