# Service identity
quarkus.application.name=assembly-service

%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/assemblydb
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/assemblydb
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=factory
quarkus.datasource.password=factory

# Schema managed by Flyway migrations
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.hibernate-orm.database.generation=validate

# HTTP
quarkus.http.port=8085
%prod.quarkus.http.port=8080

# Kafka bootstrap
%dev.kafka.bootstrap.servers=localhost:9092
%prod.kafka.bootstrap.servers=kafka:29092

# OpenAPI / Swagger
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Assembly Service API

# Kafka incoming channel: parts-reserved
mp.messaging.incoming.parts-reserved.connector=smallrye-kafka
mp.messaging.incoming.parts-reserved.topic=parts-reserved
mp.messaging.incoming.parts-reserved.group.id=assembly-parts-reserved
mp.messaging.incoming.parts-reserved.auto.offset.reset=earliest
mp.messaging.incoming.parts-reserved.value.deserializer=com.smartfactory.common.kafka.PartsReservedEventDeserializer

# Kafka incoming channel: quality-rework-required
mp.messaging.incoming.quality-rework-required.connector=smallrye-kafka
mp.messaging.incoming.quality-rework-required.topic=quality-rework-required
mp.messaging.incoming.quality-rework-required.group.id=assembly-quality-rework-required
mp.messaging.incoming.quality-rework-required.auto.offset.reset=earliest
mp.messaging.incoming.quality-rework-required.value.deserializer=com.smartfactory.common.kafka.QualityReworkRequiredEventDeserializer

# Kafka incoming channel: production-planned
mp.messaging.incoming.production-planned.connector=smallrye-kafka
mp.messaging.incoming.production-planned.topic=production-planned
mp.messaging.incoming.production-planned.group.id=assembly-production-planned
mp.messaging.incoming.production-planned.value.deserializer=com.smartfactory.common.kafka.ProductionPlannedEventDeserializer
mp.messaging.incoming.production-planned.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# DLQ for messages that cannot be processed
mp.messaging.incoming.production-planned.failure-strategy=dead-letter-queue
mp.messaging.incoming.production-planned.dead-letter-queue.topic=production-planned-dlq
mp.messaging.incoming.production-planned.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Kafka incoming channel: production-planned-dlq
mp.messaging.incoming.production-planned-dlq.connector=smallrye-kafka
mp.messaging.incoming.production-planned-dlq.topic=production-planned-dlq
mp.messaging.incoming.production-planned-dlq.group.id=assembly-production-planned-dlq
mp.messaging.incoming.production-planned-dlq.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka outgoing channel: material-requested
mp.messaging.outgoing.material-requested.connector=smallrye-kafka
mp.messaging.outgoing.material-requested.topic=material-requested
mp.messaging.outgoing.material-requested.value.serializer=com.smartfactory.common.kafka.MaterialRequestedEventSerializer
mp.messaging.outgoing.material-requested.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.material-requested.acks=all
mp.messaging.outgoing.material-requested.enable.idempotence=true

# Kafka outgoing channel: vehicle-stage-advanced
mp.messaging.outgoing.vehicle-stage-advanced.connector=smallrye-kafka
mp.messaging.outgoing.vehicle-stage-advanced.topic=vehicle-stage-advanced
mp.messaging.outgoing.vehicle-stage-advanced.value.serializer=com.smartfactory.common.kafka.VehicleStageAdvancedEventSerializer

# Kafka outgoing channel: vehicle-assembled
mp.messaging.outgoing.vehicle-assembled.connector=smallrye-kafka
mp.messaging.outgoing.vehicle-assembled.topic=vehicle-assembled
mp.messaging.outgoing.vehicle-assembled.value.serializer=com.smartfactory.common.kafka.VehicleAssembledEventSerializer
mp.messaging.outgoing.vehicle-assembled.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.vehicle-assembled.acks=all
mp.messaging.outgoing.vehicle-assembled.enable.idempotence=true

# File logging
quarkus.log.file.enable=true
quarkus.log.file.path=logs/application.log
quarkus.log.file.level=INFO
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=1