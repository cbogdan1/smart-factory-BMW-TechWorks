# H2 test datasource
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:assemblydb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate creates the schema from Assembly entities during tests
quarkus.hibernate-orm.database.generation=drop-and-create

# Flyway migrations target PostgreSQL and are not needed for this H2 persistence test
quarkus.flyway.active=false

# Kafka is not required for repository/service persistence tests
quarkus.kafka.devservices.enabled=false
mp.messaging.incoming.parts-reserved.enabled=false
mp.messaging.incoming.quality-rework-required.enabled=false
